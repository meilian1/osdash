<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Outlet performance</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #5f6877;
    --border: #e1e5eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --ok: #2f7fd0;
    --bad: #d93a3a;
    --grid: #e6e9ee;
    --line: #8a93a3;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --card: #181c24;
      --text: #e8ebf0;
      --muted: #9aa3b2;
      --border: #2a303b;
      --accent: #5b8def;
      --accent-text: #0b0f16;
      --ok: #5aa2ee;
      --bad: #f06a6a;
      --grid: #2a303b;
      --line: #7d8696;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi .value.bad { color: var(--bad); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters button {
    font: inherit;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  .filters button:focus-visible, .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart-wrap { display: flex; }
  .axis { flex: none; }
  .scroll { overflow-x: auto; flex: 1; min-width: 0; -webkit-overflow-scrolling: touch; }
  .chart-svg text { fill: var(--muted); font-size: 11px; }
  .chart-svg .val { fill: var(--text); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend i.dash { width: 16px; height: 0; border-top: 2px dashed var(--line); border-radius: 0; vertical-align: 3px; }
  ol.attn { list-style: none; margin: 0; padding: 0; }
  ol.attn li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  ol.attn li:first-child { border-top: 0; padding-top: 0; }
  .attn .who { font-weight: 600; }
  .attn .meta { color: var(--muted); font-size: 13px; }
  .attn .pct { color: var(--bad); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); margin: 0; }
  #status { text-align: center; padding: 40px 16px; }
  #status.error { border-color: var(--bad); }
  #status .title { font-weight: 650; margin-bottom: 4px; }
  #status .detail { color: var(--muted); font-size: 13px; word-break: break-word; }
  .retry {
    margin-top: 14px; font: inherit; padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi .value { font-size: 22px; }
    h1 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Outlet performance</h1>
  <p class="sub" id="subtitle">Weekly sales against target</p>

  <div id="status" class="card" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="title">Loading sales data…</div>
    <div class="detail">Fetching the latest figures from Google Sheets.</div>
  </div>

  <div id="app" hidden>
    <section class="kpis" aria-label="Key figures">
      <div class="card kpi"><div class="label">Total sales</div><div class="value" id="k-sales"></div><div class="note" id="k-sales-n"></div></div>
      <div class="card kpi"><div class="label">% of target</div><div class="value" id="k-pct"></div><div class="note" id="k-pct-n"></div></div>
      <div class="card kpi"><div class="label">Orders</div><div class="value" id="k-orders"></div><div class="note" id="k-orders-n"></div></div>
      <div class="card kpi"><div class="label">Returns %</div><div class="value" id="k-ret"></div><div class="note" id="k-ret-n"></div></div>
    </section>

    <div class="filters" id="filters" role="group" aria-label="Filter by outlet"></div>

    <section class="card" style="margin-bottom:16px">
      <h2>Sales as % of target, by outlet and week</h2>
      <div class="chart-wrap">
        <svg class="axis chart-svg" id="axis" aria-hidden="true"></svg>
        <div class="scroll" id="scroll" tabindex="0" role="img" aria-label="Bar chart of sales as a percentage of target"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>90% of target or above</span>
        <span><i style="background:var(--bad)"></i>Below 90%</span>
        <span><i class="dash"></i>90% threshold</span>
      </div>
    </section>

    <section class="card">
      <h2>Needs attention</h2>
      <div id="attn"></div>
    </section>
  </div>
</main>

<script>
  // ---- Config ---------------------------------------------------------------
  const CONFIG = {
    sheetUrl: "https://docs.google.com/spreadsheets/d/1Aq2-BKuqOJX-2crTM8z4zLaPFoqIyQWk/edit?usp=sharing",
    tabName: "Combined",
    threshold: 0.9   // weeks below this share of target need attention
  };
  // ---------------------------------------------------------------------------

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const fmtInt = n => Math.round(n).toLocaleString("en-US");
  const fmtPct = (n, d = 1) => (n * 100).toFixed(d) + "%";
  let rows = [];
  let selected = "All";

  function sheetId(url) {
    const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (!m) throw new Error("Could not find a spreadsheet ID in the sheet link in CONFIG.");
    return m[1];
  }

  function dataUrl() {
    return "https://docs.google.com/spreadsheets/d/" + sheetId(CONFIG.sheetUrl) +
      "/gviz/tq?tqx=responseHandler:onSheetLoaded&sheet=" + encodeURIComponent(CONFIG.tabName) + "&_=" + Date.now();
  }

  // Loaded with a <script> tag (JSONP) because fetch() is blocked by CORS when the page is opened from a file.
  function fetchSheet() {
    return new Promise((resolve, reject) => {
      const tag = document.createElement("script");
      const timer = setTimeout(() => done(new Error("Timed out waiting for Google Sheets. The sheet may not be shared publicly.")), 15000);
      function done(err, data) {
        clearTimeout(timer);
        delete window.onSheetLoaded;
        tag.remove();
        err ? reject(err) : resolve(data);
      }
      window.onSheetLoaded = data => done(null, data);
      tag.onerror = () => done(new Error("Could not reach Google Sheets."));
      tag.src = dataUrl();
      document.head.appendChild(tag);
    });
  }

  function toRows(resp) {
    if (!resp || resp.status !== "ok") {
      const msg = resp && resp.errors && resp.errors[0] ? (resp.errors[0].detailed_message || resp.errors[0].message) : "unknown error";
      throw new Error("Google Sheets reported: " + msg);
    }
    const cols = resp.table.cols.map(c => String(c.label || "").trim().toLowerCase());
    const need = ["outlet", "week", "sales", "target", "orders", "returns"];
    const idx = {};
    for (const k of need) {
      idx[k] = cols.indexOf(k);
      if (idx[k] < 0) throw new Error("Column \u201c" + k + "\u201d is missing from the \u201c" + CONFIG.tabName + "\u201d tab. Found: " + cols.join(", "));
    }
    const cell = (r, k) => { const c = r.c[idx[k]]; return c ? c.v : null; };
    const out = resp.table.rows.map(r => ({
      outlet: String(cell(r, "outlet") ?? "").trim(),
      week: String(cell(r, "week") ?? "").trim(),
      sales: Number(cell(r, "sales")),
      target: Number(cell(r, "target")),
      orders: Number(cell(r, "orders")),
      returns: Number(cell(r, "returns"))
    })).filter(r => r.outlet && isFinite(r.sales) && isFinite(r.target) && r.target > 0);
    if (!out.length) throw new Error("No valid rows found in the \u201c" + CONFIG.tabName + "\u201d tab.");
    out.forEach(r => { r.pct = r.sales / r.target; });
    return out;
  }

  function weekLabel(w) {
    const m = w.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return w;
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  }

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  function filtered() { return selected === "All" ? rows : rows.filter(r => r.outlet === selected); }

  function renderKpis(d) {
    const sum = k => d.reduce((a, r) => a + r[k], 0);
    const sales = sum("sales"), target = sum("target"), orders = sum("orders"), returns = sum("returns");
    const pct = sales / target;
    $("k-sales").textContent = fmtInt(sales);
    $("k-sales-n").textContent = "Target " + fmtInt(target);
    $("k-pct").textContent = fmtPct(pct);
    $("k-pct").classList.toggle("bad", pct < CONFIG.threshold);
    $("k-pct-n").textContent = (sales >= target ? "+" : "") + fmtInt(sales - target) + " vs target";
    $("k-orders").textContent = fmtInt(orders);
    $("k-orders-n").textContent = d.length + " outlet-weeks";
    $("k-ret").textContent = orders ? fmtPct(returns / orders) : "n/a";
    $("k-ret-n").textContent = fmtInt(returns) + " returns";
  }

  function renderChart(d) {
    const H = 300, top = 22, bottom = 52, plotH = H - top - bottom;
    const barW = 44, gap = 20, groupGap = 16, padL = 8, padR = 12;
    const maxPct = Math.max(1.2, ...d.map(r => r.pct));
    const yMax = Math.ceil(maxPct * 10 + 0.5) / 10;
    const y = v => top + plotH * (1 - v / yMax);

    // Axis (fixed, left)
    const axis = $("axis");
    axis.setAttribute("width", 40); axis.setAttribute("height", H);
    axis.replaceChildren();
    for (let v = 0; v <= yMax + 1e-9; v += 0.2) {
      axis.appendChild(el("text", { x: 34, y: y(v) + 4, "text-anchor": "end" }, Math.round(v * 100) + "%"));
    }

    // Plot (scrolls)
    let x = padL, prev = null;
    const pos = d.map(r => {
      if (prev !== null && r.outlet !== prev) x += groupGap;
      prev = r.outlet;
      const p = x; x += barW + gap; return p;
    });
    const W = Math.max(x - gap + padR, 300);
    const svg = el("svg", { class: "chart-svg", width: W, height: H, viewBox: "0 0 " + W + " " + H });
    svg.style.minWidth = "100%";
    svg.style.display = "block";

    for (let v = 0; v <= yMax + 1e-9; v += 0.2) {
      svg.appendChild(el("line", { x1: 0, x2: W, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    }
    d.forEach((r, i) => {
      const bad = r.pct < CONFIG.threshold;
      const g = el("g", {});
      g.appendChild(el("title", {}, r.outlet + ", week of " + weekLabel(r.week) + ": " + fmtPct(r.pct) + " of target (" + fmtInt(r.sales) + " / " + fmtInt(r.target) + ")"));
      const h = Math.max(plotH * r.pct / yMax, 1);
      g.appendChild(el("rect", { x: pos[i], y: y(r.pct), width: barW, height: h, rx: 3, fill: bad ? "var(--bad)" : "var(--ok)" }));
      g.appendChild(el("text", { class: "val", x: pos[i] + barW / 2, y: y(r.pct) - 5, "text-anchor": "middle" }, (r.pct * 100).toFixed(1) + "%"));
      g.appendChild(el("text", { x: pos[i] + barW / 2, y: H - bottom + 16, "text-anchor": "middle" }, weekLabel(r.week)));
      g.appendChild(el("text", { x: pos[i] + barW / 2, y: H - bottom + 31, "text-anchor": "middle" }, r.outlet));
      svg.appendChild(g);
    });
    svg.appendChild(el("line", { x1: 0, x2: W, y1: y(CONFIG.threshold), y2: y(CONFIG.threshold), stroke: "var(--line)", "stroke-width": 1.5, "stroke-dasharray": "6 4" }));
    svg.appendChild(el("text", { x: W - 4, y: y(CONFIG.threshold) - 5, "text-anchor": "end" }, Math.round(CONFIG.threshold * 100) + "%"));

    $("scroll").replaceChildren(svg);
  }

  function renderAttention(d) {
    const bad = d.filter(r => r.pct < CONFIG.threshold).sort((a, b) => a.pct - b.pct);
    const box = $("attn");
    box.replaceChildren();
    if (!bad.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No outlet-weeks are below " + Math.round(CONFIG.threshold * 100) + "% of target.";
      box.appendChild(p);
      return;
    }
    const ol = document.createElement("ol");
    ol.className = "attn";
    for (const r of bad) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      const who = document.createElement("div"); who.className = "who"; who.textContent = r.outlet + ", week of " + weekLabel(r.week);
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = fmtInt(r.sales) + " sales vs " + fmtInt(r.target) + " target (short by " + fmtInt(r.target - r.sales) + ")";
      left.append(who, meta);
      const pct = document.createElement("div"); pct.className = "pct"; pct.textContent = fmtPct(r.pct);
      li.append(left, pct);
      ol.appendChild(li);
    }
    box.appendChild(ol);
  }

  function render() {
    const d = filtered();
    renderKpis(d);
    renderChart(d);
    renderAttention(d);
    document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.outlet === selected)));
  }

  function buildFilters() {
    const names = ["All", ...new Set(rows.map(r => r.outlet))];
    const box = $("filters");
    box.replaceChildren();
    for (const n of names) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = n; b.dataset.outlet = n;
      b.addEventListener("click", () => { selected = n; render(); $("scroll").scrollLeft = 0; });
      box.appendChild(b);
    }
  }

  function showError(err) {
    const s = $("status");
    s.className = "card error";
    s.hidden = false; $("app").hidden = true;
    s.replaceChildren();
    const t = document.createElement("div"); t.className = "title"; t.textContent = "Could not load the sales data";
    const d = document.createElement("div"); d.className = "detail";
    d.textContent = (err && err.message ? err.message : String(err)) +
      " Check that the sheet is shared as “Anyone with the link can view” and that the tab is named “" + CONFIG.tabName + "”.";
    const b = document.createElement("button"); b.className = "retry"; b.type = "button"; b.textContent = "Try again";
    b.addEventListener("click", load);
    s.append(t, d, b);
  }

  function showLoading() {
    const s = $("status");
    s.className = "card"; s.hidden = false; $("app").hidden = true;
    s.innerHTML = '<div class="spinner"></div><div class="title">Loading sales data…</div><div class="detail">Fetching the latest figures from Google Sheets.</div>';
  }

  async function load() {
    showLoading();
    try {
      const resp = await fetchSheet();
      rows = toRows(resp);
      selected = "All";
      buildFilters();
      $("status").hidden = true; $("app").hidden = false;
      $("subtitle").textContent = "Weekly sales against target, " + weekLabel(rows[0].week) + " to " + weekLabel(rows[rows.length - 1].week);
      render();
    } catch (err) {
      showError(err);
    }
  }

  load();
</script>
</body>
</html>
